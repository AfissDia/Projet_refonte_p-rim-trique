# RECONSTRUCTION basée sur les paramètres observés dans le lab.
# Vérifier avec : sudo docker compose config ; Docker/CRS peuvent modifier les valeurs par défaut selon les images.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: p5-juice-shop
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - waf-net

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: p5-waf
    depends_on:
      - juice-shop
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND: "http://juice-shop:3000"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    restart: unless-stopped
    networks:
      - waf-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  waf-net:
    driver: bridge
